# AdCraft AI — Hyper-Engine v2.0
# Full-stack orchestration: Next.js frontend, Node API gateway,
# Python render worker, RAG vector DB, CNN inference service, Postgres, Redis.
# Designed & Developed by Nikhil Chary Sriramoju
#
# Usage:
#   docker compose up --build
#   Frontend      → http://localhost:3000
#   API Gateway   → http://localhost:4000
#   Render Worker → http://localhost:8000
#   Vector DB     → http://localhost:8001
#   CNN Service   → http://localhost:8500

version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://adcraft:adcraft@postgres:5432/adcraft
      - REDIS_URL=redis://redis:6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
      - VECTOR_DB_URL=http://vectordb:8000
    depends_on:
      - postgres
      - redis
      - vectordb

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql://adcraft:adcraft@postgres:5432/adcraft
      - REDIS_URL=redis://redis:6379
      - VECTOR_DB_URL=http://vectordb:8000
      - CNN_SERVICE_URL=http://cnn-worker:8500
    depends_on:
      - postgres
      - redis
      - vectordb
      - cnn-worker

  # ---- RAG: vector database for the copy/brand knowledge base ----
  vectordb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - adcraft_vectordb:/chroma/chroma

  # ---- CNN: brand/logo visual analysis inference service ----
  cnn-worker:
    build:
      context: ./cnn-worker
      dockerfile: Dockerfile
    ports:
      - "8500:8500"
    environment:
      - MODEL_NAME=mobilenet_v2
    volumes:
      - adcraft_models:/models

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=adcraft
      - POSTGRES_PASSWORD=adcraft
      - POSTGRES_DB=adcraft
    ports:
      - "5432:5432"
    volumes:
      - adcraft_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  adcraft_pg:
  adcraft_vectordb:
  adcraft_models:
